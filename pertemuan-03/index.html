<section id="contact"> 
  <h2>Kontak</h2> 
  <p>Kunjungi <a href="https://github.com/sifa-sf">profil GitHub saya</a>.</p>

  <form action="index.html" method="get"> 
    <div class="form-group">
      <label for="nama">Nama Lengkap</label><br>
      <input class="input-form"
             type="text"
             id="nama"
             name="nama"
             placeholder="Masukkan Nama Lengkap"
             minlength="3"
             maxlength="50"
             required>
    </div>

    <div class="form-group">
      <label for="email">Email</label><br>
      <input class="input-form"
             type="email"
             id="email"
             name="email"
             placeholder="nama@email.com"
             required>
    </div>

    <div class="form-group">
      <label for="semester">Semester</label><br>
      <input class="input-form"
             type="number"
             id="semester"
             name="semester"
             placeholder="Masukkan Semester"
             min="1"
             max="14"
             required>
    </div>

    <div class="form-group">
      <label for="tanggal">Tanggal Kunjungan</label><br>
      <input class="input-form"
             type="date"
             id="tanggal"
             name="tanggal"
             required>
    </div>

    <div class="form-group">
      <p>Jenis Pesan</p>
      <input type="radio" id="pertanyaan" name="jenis_pesan" value="pertanyaan" required>
      <label for="pertanyaan">Pertanyaan</label>
      <input type="radio" id="saran" name="jenis_pesan" value="saran">
      <label for="saran">Saran</label>
    </div>

    <div class="form-group">
      <p>Topik yang Diminati</p>
      <input type="checkbox" id="minat-html" name="minat" value="HTML">
      <label for="minat-html">HTML</label>
      <input type="checkbox" id="minat-css" name="minat" value="CSS">
      <label for="minat-css">CSS</label>
    </div>

    <div class="form-group">
      <label for="Prodi">Program Studi</label><br>
      <select class="input-form" id="prodi" name="prodi" required>
        <option value="">-- Pilih Program Studi --</option>
        <option value="BD">Bisnis Digital</option>
        <option value="SI">Sistem Informasi</option>
        <option value="TI">Teknik Informatika</option>
      </select>
    </div>

    <div class="form-group">
      <label for="pesan">Pesan</label><br>
      <textarea class="input-form"
                id="pesan"
                name="pesan"
                maxlength="300"
                placeholder="Tulisan Pesan Anda"
                required></textarea>
    </div>
    <button type="submit">Kirim</button>
    <button type="reset">Batal</button>

    <footer>
    <p>&copy; 2026 Sifa Sukma Fira 2622500038</p>
  </footer>

  </form>
</section>
